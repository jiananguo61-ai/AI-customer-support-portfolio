<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI 客服 V2 评测成功证据</title>
  <desc id="desc">80 条离线评测中 78 条通过，总体通过率 97.5%，工具执行、高风险安全和确认合规率均为 100%。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbfc"/><stop offset="1" stop-color="#edf6f5"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#143c5d" flood-opacity=".09"/></filter>
    <style>
      .sans{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.ink{fill:#102235}.muted{fill:#65758b}.teal{fill:#087f75}.white{fill:#fff}.label{font-size:17px}.small{font-size:14px}.metric{font-size:39px;font-weight:800}.bold{font-weight:700}.title{font-size:48px;font-weight:800;letter-spacing:-1px}.h2{font-size:24px;font-weight:750}.mono{font-family:"Cascadia Code",Consolas,monospace}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="35" r="240" fill="#14b8a6" opacity=".08"/>
  <g class="sans">
    <text x="72" y="74" class="teal bold" font-size="16" letter-spacing="3">EVALUATION EVIDENCE · V2</text>
    <text x="72" y="137" class="ink title">AI 客服评测闭环</text>
    <text x="72" y="176" class="muted" font-size="19">同一套 80 条虚构售后测试 · 可复现离线 Harness · 不冒充线上业务指标</text>
    <g transform="translate(1248 55)" filter="url(#shadow)">
      <rect width="280" height="122" rx="20" fill="#e7f8f4" stroke="#bde5dc"/>
      <text x="28" y="46" class="teal bold" font-size="24">✓ V2 复测通过</text>
      <text x="28" y="82" fill="#45665f" font-size="16">78 / 80 cases · 5 / 5 tests</text>
    </g>

    <g transform="translate(72 224)" filter="url(#shadow)">
      <g><rect width="278" height="154" rx="18" class="white" stroke="#dce6ee"/><text x="24" y="37" class="muted label">总体通过率</text><text x="24" y="90" class="ink metric">97.5%</text><text x="24" y="125" class="teal bold" font-size="16">V1 22.5% · +75pp</text></g>
      <g transform="translate(294)"><rect width="278" height="154" rx="18" class="white" stroke="#dce6ee"/><text x="24" y="37" class="muted label">意图准确率</text><text x="24" y="90" class="ink metric">97.5%</text><text x="24" y="125" class="teal bold" font-size="16">V1 41.25%</text></g>
      <g transform="translate(588)"><rect width="278" height="154" rx="18" class="white" stroke="#dce6ee"/><text x="24" y="37" class="muted label">工具执行成功率</text><text x="24" y="90" class="ink metric">100%</text><text x="24" y="125" class="teal bold" font-size="16">可执行 · 可审计</text></g>
      <g transform="translate(882)"><rect width="278" height="154" rx="18" class="white" stroke="#dce6ee"/><text x="24" y="37" class="muted label">高风险安全率</text><text x="24" y="90" class="ink metric">100%</text><text x="24" y="125" class="teal bold" font-size="16">未确认不执行</text></g>
      <g transform="translate(1176)"><rect width="278" height="154" rx="18" class="white" stroke="#dce6ee"/><text x="24" y="37" class="muted label">确认合规率</text><text x="24" y="90" class="ink metric">100%</text><text x="24" y="125" class="teal bold" font-size="16">显式确认门</text></g>
    </g>

    <g transform="translate(72 410)">
      <g filter="url(#shadow)"><rect width="780" height="402" rx="22" class="white" stroke="#dce6ee"/></g>
      <text x="28" y="47" class="ink h2">V1 → V2 指标变化</text><text x="28" y="77" class="muted small">灰色为 V1，绿色为同一数据集上的 V2</text>
      <g transform="translate(28 112)">
        <text y="16" class="ink label">总体通过率</text><rect x="190" y="2" width="500" height="16" rx="8" fill="#edf1f4"/><rect x="190" y="2" width="113" height="16" rx="8" fill="#b9c5cf"/><rect x="190" y="2" width="488" height="16" rx="8" fill="url(#bar)"/><text x="710" y="16" class="ink bold label">97.5%</text>
        <text y="76" class="ink label">意图准确率</text><rect x="190" y="62" width="500" height="16" rx="8" fill="#edf1f4"/><rect x="190" y="62" width="206" height="16" rx="8" fill="#b9c5cf"/><rect x="190" y="62" width="488" height="16" rx="8" fill="url(#bar)"/><text x="710" y="76" class="ink bold label">97.5%</text>
        <text y="136" class="ink label">工具执行</text><rect x="190" y="122" width="500" height="16" rx="8" fill="#edf1f4"/><rect x="190" y="122" width="125" height="16" rx="8" fill="#b9c5cf"/><rect x="190" y="122" width="500" height="16" rx="8" fill="url(#bar)"/><text x="710" y="136" class="ink bold label">100%</text>
        <text y="196" class="ink label">转人工召回</text><rect x="190" y="182" width="500" height="16" rx="8" fill="#edf1f4"/><rect x="190" y="182" width="125" height="16" rx="8" fill="#b9c5cf"/><rect x="190" y="182" width="458" height="16" rx="8" fill="url(#bar)"/><text x="700" y="196" class="ink bold label">91.67%</text>
        <text y="256" class="ink label">高风险安全</text><rect x="190" y="242" width="500" height="16" rx="8" fill="#edf1f4"/><rect x="190" y="242" width="154" height="16" rx="8" fill="#b9c5cf"/><rect x="190" y="242" width="500" height="16" rx="8" fill="url(#bar)"/><text x="710" y="256" class="ink bold label">100%</text>
        <circle cx="200" cy="299" r="6" fill="#b9c5cf"/><text x="214" y="304" class="muted small">V1 基线</text><circle cx="310" cy="299" r="6" fill="#14b8a6"/><text x="324" y="304" class="muted small">V2 复测</text>
      </g>

      <g transform="translate(802)" filter="url(#shadow)"><rect width="654" height="402" rx="22" class="white" stroke="#dce6ee"/></g>
      <g transform="translate(830)">
        <text y="47" class="ink h2">代表性路由与工具轨迹</text><text y="77" class="muted small">均为虚构数据；不连接真实订单系统</text>
        <g transform="translate(0 103)">
          <g><rect width="42" height="42" rx="12" fill="#e7f8f4"/><text x="14" y="28" class="teal bold">R</text><text x="58" y="17" class="ink bold label">退货政策 → RAG 回答</text><text x="58" y="40" class="muted small">返回 knowledge/return-policy.md 引用</text><rect x="520" y="8" width="78" height="27" rx="14" fill="#e4f7f1"/><text x="540" y="27" class="teal bold small">PASS</text></g>
          <g transform="translate(0 60)"><rect width="42" height="42" rx="12" fill="#e7f8f4"/><text x="14" y="28" class="teal bold">T</text><text x="58" y="17" class="ink bold label">订单查询 → order_lookup</text><text x="58" y="40" class="muted small">只读工具执行并写入结构化 trace</text><rect x="492" y="8" width="106" height="27" rx="14" fill="#e4f7f1"/><text x="508" y="27" class="teal bold small">EXECUTED</text></g>
          <g transform="translate(0 120)"><rect width="42" height="42" rx="12" fill="#fff2dc"/><text x="13" y="28" fill="#bd6a16" class="bold">✓</text><text x="58" y="17" class="ink bold label">地址修改 → 明确确认门</text><text x="58" y="40" class="muted small">未确认不调用；确认后才执行模拟工具</text><rect x="502" y="8" width="96" height="27" rx="14" fill="#fff2dc"/><text x="517" y="27" fill="#9a570f" class="bold small">GUARDED</text></g>
          <g transform="translate(0 180)"><rect width="42" height="42" rx="12" fill="#e7f8f4"/><text x="14" y="28" class="teal bold">H</text><text x="58" y="17" class="ink bold label">知识不足 / 投诉 → handoff</text><text x="58" y="40" class="muted small">不猜测，携带原因转人工队列</text><rect x="510" y="8" width="88" height="27" rx="14" fill="#e4f7f1"/><text x="524" y="27" class="teal bold small">ROUTED</text></g>
          <g transform="translate(0 240)"><rect width="42" height="42" rx="12" fill="#fff2dc"/><text x="14" y="28" fill="#bd6a16" class="bold">S</text><text x="58" y="17" class="ink bold label">提示词注入 → 拒绝并转人工</text><text x="58" y="40" class="muted small">跨客户与越权请求均不执行</text><rect x="506" y="8" width="92" height="27" rx="14" fill="#fff2dc"/><text x="520" y="27" fill="#9a570f" class="bold small">BLOCKED</text></g>
        </g>
      </g>
    </g>
    <text x="72" y="858" class="muted small">数据源：reports/metrics.json · reports/eval_results_v2.csv · Portfolio-owned synthetic cases</text>
    <text x="1440" y="858" text-anchor="end" class="muted small">2026-09-02</text>
  </g>
</svg>
